    <title>Vellum</title>
    <meta name="description" content="Vellum is a model studio in your browser and a plugin on your Minecraft server. Shape, paint and animate mobs, items and blocks, then push them to your players." />

      // dark page doesn't flash light while the app loads.
      if (!/^#\/editor/.test(location.hash)) document.documentElement.dataset.surface = 'dark'
